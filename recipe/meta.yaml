{% set name = "rasterstats" %}
{% set version = "0.21.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rasterstats-{{ version }}.tar.gz
  sha256: 2b955f6775b7f641c8094d00bc4381492184ba162b5dba1baa69df8db98efa5f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - pip
  run:
    - pyogrio
    - python >={{ python_min }}
    - affine
    - click >7.1,!=8.2.1
    - cligj >=0.4
    - fiona
    - numpy >=1.9
    - rasterio >=1.0
    - simplejson
    - shapely

test:
  imports:
    - rasterstats
  commands:
    - pip check
    - rio zonalstats --help
    - rio pointquery --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/perrygeo/python-raster-stats
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Summarize geospatial raster datasets based on vector geometries

extra:
  recipe-maintainers:
    - perrygeo
    - ocefpaf
